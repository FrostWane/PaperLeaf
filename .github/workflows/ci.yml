name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack install --global pnpm@9.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm storybook:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm lighthouse

  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: paperleaf_test
          POSTGRES_USER: paperleaf
          POSTGRES_PASSWORD: paperleaf-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperleaf -d paperleaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PAPERLEAF_DATABASE_URL: postgresql+asyncpg://paperleaf:paperleaf-ci-only@127.0.0.1:5432/paperleaf_test
      PAPERLEAF_TEST_DATABASE_URL: postgresql+asyncpg://paperleaf:paperleaf-ci-only@127.0.0.1:5432/paperleaf_test
      PAPERLEAF_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: pip install --constraint requirements.lock -e ".[dev]"
      - name: 校验环境变量和版本契约
        working-directory: .
        run: |
          python scripts/verify_env_contract.py
          python -m pytest backend/tests/test_env_contract.py backend/tests/test_version_contract.py -q
      - run: python -m compileall paperleaf_api tests alembic/versions ../academic_mcp ../scripts/smoke_compose.py
      - run: ruff check paperleaf_api tests alembic/versions ../academic_mcp ../scripts/smoke_compose.py
      - name: 校验自建冻结 RAG 数据集
        run: >-
          python -m paperleaf_api.evaluation_dataset
          --manifest evaluation/datasets/paperleaf-rag-v1/manifest.json
          --cases evaluation/datasets/paperleaf-rag-v1/cases.jsonl
      - name: 校验 QASPER 校准集
        run: >-
          python -m paperleaf_api.evaluation_dataset
          --manifest evaluation/datasets/paperleaf-qasper-calibration-v1/manifest.json
          --cases evaluation/datasets/paperleaf-qasper-calibration-v1/cases.jsonl
      - name: 校验 QASPER holdout 公开输入与锁
        run: >-
          python -m paperleaf_api.evaluation_holdout verify-public
          --lock evaluation/datasets/paperleaf-qasper-holdout-v1/lock.json
          --manifest evaluation/datasets/paperleaf-qasper-holdout-v1/manifest.json
          --questions evaluation/datasets/paperleaf-qasper-holdout-v1/questions.jsonl
      - name: 校验 QASPER 选择性 holdout 与校准集隔离
        run: >-
          python -m paperleaf_api.evaluation_holdout verify-public
          --lock evaluation/datasets/paperleaf-qasper-selective-holdout-v2/lock.json
          --manifest evaluation/datasets/paperleaf-qasper-selective-holdout-v2/manifest.json
          --questions evaluation/datasets/paperleaf-qasper-selective-holdout-v2/questions.jsonl
          --exclusion-manifest evaluation/datasets/paperleaf-qasper-calibration-v1/manifest.json
      - name: 运行 Agent Harness 确定性评测
        run: >-
          python -m paperleaf_api.evaluation_harness
          --cases evaluation/context-harness-v1/cases.jsonl
      - name: 升级测试数据库
        run: alembic upgrade head
      - run: pytest
      - name: 验证全新安装与旧库升级迁移
        run: |
          alembic downgrade 20260722_0002
          alembic upgrade head
          alembic check

  full-stack-smoke:
    name: 隔离全栈 smoke
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack install --global pnpm@9.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: 从空卷验证 API、Worker、SSE、引用、Range 与页码跳转
        run: python scripts/run_isolated_full_stack_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-stack-smoke
          path: docs/release-evidence/v0.9.0/full-stack-smoke.json
          if-no-files-found: error

  containers:
    name: 容器配置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build web api worker migrate academic-search-mcp

  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: SBOM 与漏洞扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: paperleaf-v0.9.0.spdx.json
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-evidence
          path: |
            paperleaf-v0.9.0.spdx.json
            trivy-results.sarif
