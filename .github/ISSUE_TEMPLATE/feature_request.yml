name: 功能建议
description: 描述一个明确的科研阅读问题和期望行为
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述实际工作流中的困难，而不是只给出技术方案。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为
      description: 描述用户如何完成任务，以及什么结果算成功。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: textarea
    id: risks
    attributes:
      label: 数据、安全或兼容性影响
      description: 尤其说明是否涉及外部模型、文献来源、权限或数据库迁移。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现相同建议。
          required: true
        - label: 建议不要求绕过付费墙或来源访问控制。
          required: true
