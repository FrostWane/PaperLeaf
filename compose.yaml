  PAPERLEAF_RAG_QUERY_REWRITE_MAX_QUERIES: ${PAPERLEAF_RAG_QUERY_REWRITE_MAX_QUERIES:-2}
  PAPERLEAF_RAG_RERANKER_ENABLED: ${PAPERLEAF_RAG_RERANKER_ENABLED:-false}
  PAPERLEAF_RAG_RERANKER_STRATEGY: ${PAPERLEAF_RAG_RERANKER_STRATEGY:-multigranular_v1}
  PAPERLEAF_RAG_RERANKER_MODEL: ${PAPERLEAF_RAG_RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
  PAPERLEAF_RAG_RERANKER_CANDIDATE_LIMIT: ${PAPERLEAF_RAG_RERANKER_CANDIDATE_LIMIT:-40}
  PAPERLEAF_RAG_RERANKER_TIMEOUT_SECONDS: ${PAPERLEAF_RAG_RERANKER_TIMEOUT_SECONDS:-3}
  PAPERLEAF_CORS_ORIGINS: ${PAPERLEAF_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  PAPERLEAF_OPENAI_API_KEY: ${PAPERLEAF_OPENAI_API_KEY:-}
  PAPERLEAF_OPENAI_BASE_URL: ${PAPERLEAF_OPENAI_BASE_URL:-https://api.openai.com/v1}
  PAPERLEAF_CHAT_MODEL: ${PAPERLEAF_CHAT_MODEL:-gpt-4.1-mini}
  PAPERLEAF_EMBEDDING_ENABLED: ${PAPERLEAF_EMBEDDING_ENABLED:-true}
  PAPERLEAF_EMBEDDING_PROVIDER: ${PAPERLEAF_EMBEDDING_PROVIDER:-auto}
  PAPERLEAF_EMBEDDING_MODEL: ${PAPERLEAF_EMBEDDING_MODEL:-text-embedding-3-small}
  PAPERLEAF_EMBEDDING_DIMENSIONS: ${PAPERLEAF_EMBEDDING_DIMENSIONS:-}
  PAPERLEAF_EMBEDDING_INDEX_REVISION: ${PAPERLEAF_EMBEDDING_INDEX_REVISION:-2}
  PAPERLEAF_EMBEDDING_INPUT_FORMAT: ${PAPERLEAF_EMBEDDING_INPUT_FORMAT:-paper_context_v2}
  PAPERLEAF_EMBEDDING_BATCH_SIZE: ${PAPERLEAF_EMBEDDING_BATCH_SIZE:-8}
  PAPERLEAF_EMBEDDING_TIMEOUT_SECONDS: ${PAPERLEAF_EMBEDDING_TIMEOUT_SECONDS:-90}
  PAPERLEAF_EMBEDDING_BATCH_ATTEMPTS: ${PAPERLEAF_EMBEDDING_BATCH_ATTEMPTS:-2}
  PAPERLEAF_VISION_MODEL: ${PAPERLEAF_VISION_MODEL:-}
  PAPERLEAF_FALLBACK_OPENAI_API_KEY: ${PAPERLEAF_FALLBACK_OPENAI_API_KEY:-}
  PAPERLEAF_FALLBACK_OPENAI_BASE_URL: ${PAPERLEAF_FALLBACK_OPENAI_BASE_URL:-https://api.openai.com/v1}
  PAPERLEAF_FALLBACK_CHAT_MODEL: ${PAPERLEAF_FALLBACK_CHAT_MODEL-}
  PAPERLEAF_FALLBACK_EMBEDDING_ENABLED: ${PAPERLEAF_FALLBACK_EMBEDDING_ENABLED:-true}
  PAPERLEAF_FALLBACK_EMBEDDING_MODEL: ${PAPERLEAF_FALLBACK_EMBEDDING_MODEL:-text-embedding-3-small}
  PAPERLEAF_FALLBACK_VISION_MODEL: ${PAPERLEAF_FALLBACK_VISION_MODEL:-}
  PAPERLEAF_MODEL_TIMEOUT_SECONDS: ${PAPERLEAF_MODEL_TIMEOUT_SECONDS:-30}
  PAPERLEAF_AGENT_ANSWER_TIMEOUT_SECONDS: ${PAPERLEAF_AGENT_ANSWER_TIMEOUT_SECONDS:-90}
  PAPERLEAF_AGENT_ANSWER_RETRY_TIMEOUT_SECONDS: ${PAPERLEAF_AGENT_ANSWER_RETRY_TIMEOUT_SECONDS:-60}
  PAPERLEAF_AGENT_EVIDENCE_SUPPORT_TIMEOUT_SECONDS: ${PAPERLEAF_AGENT_EVIDENCE_SUPPORT_TIMEOUT_SECONDS:-20}
  PAPERLEAF_ANSWERABILITY_ENABLED: ${PAPERLEAF_ANSWERABILITY_ENABLED:-true}
  PAPERLEAF_ANSWERABILITY_MIN_CONFIDENCE: ${PAPERLEAF_ANSWERABILITY_MIN_CONFIDENCE:-0.50}
  PAPERLEAF_AGENT_ANSWERABILITY_TIMEOUT_SECONDS: ${PAPERLEAF_AGENT_ANSWERABILITY_TIMEOUT_SECONDS:-20}
  PAPERLEAF_TRANSLATION_TIMEOUT_SECONDS: ${PAPERLEAF_TRANSLATION_TIMEOUT_SECONDS:-90}
  PAPERLEAF_ARTIFACT_TIMEOUT_SECONDS: ${PAPERLEAF_ARTIFACT_TIMEOUT_SECONDS:-120}
  PAPERLEAF_ARTIFACT_RETRY_TIMEOUT_SECONDS: ${PAPERLEAF_ARTIFACT_RETRY_TIMEOUT_SECONDS:-90}
  PAPERLEAF_STRUCTURE_TIMEOUT_SECONDS: ${PAPERLEAF_STRUCTURE_TIMEOUT_SECONDS:-180}
  PAPERLEAF_STRUCTURE_RETRY_TIMEOUT_SECONDS: ${PAPERLEAF_STRUCTURE_RETRY_TIMEOUT_SECONDS:-120}
  PAPERLEAF_MODEL_ATTEMPTS_PER_PROVIDER: ${PAPERLEAF_MODEL_ATTEMPTS_PER_PROVIDER:-1}
  PAPERLEAF_MODEL_CIRCUIT_FAILURE_THRESHOLD: ${PAPERLEAF_MODEL_CIRCUIT_FAILURE_THRESHOLD:-3}
  PAPERLEAF_MODEL_CIRCUIT_COOLDOWN_SECONDS: ${PAPERLEAF_MODEL_CIRCUIT_COOLDOWN_SECONDS:-30}
  PAPERLEAF_EVIDENCE_MIN_CONFIDENCE: ${PAPERLEAF_EVIDENCE_MIN_CONFIDENCE:-0.35}
  PAPERLEAF_EVIDENCE_MIN_VECTOR_SCORE: ${PAPERLEAF_EVIDENCE_MIN_VECTOR_SCORE:-0.35}
  PAPERLEAF_EVIDENCE_MIN_LEXICAL_COVERAGE: ${PAPERLEAF_EVIDENCE_MIN_LEXICAL_COVERAGE:-0.18}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}

x-backend-service: &backend-service
  build:
    context: ./backend
    args:
      PAPERLEAF_GIT_SHA: ${PAPERLEAF_GIT_SHA:-unknown}
  environment: *backend-environment
  depends_on:
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  networks:
    - paperleaf

services:
  academic-search-mcp:
    build:
      context: ./academic_mcp
    environment:
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      PAPERLEAF_ACADEMIC_HTTP_TIMEOUT_SECONDS: ${PAPERLEAF_ACADEMIC_HTTP_TIMEOUT_SECONDS:-12}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - paperleaf

  redis:
    image: registry-1.docker.io/library/redis:7.4-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "${PAPERLEAF_REDIS_MAXMEMORY:-256mb}",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - paperleaf

  postgres:
    image: registry-1.docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperleaf}
      POSTGRES_USER: ${POSTGRES_USER:-paperleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperleaf-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - paperleaf

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paperleaf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-paperleaf-local}
    ports:
      - "${PAPERLEAF_BIND_ADDRESS:-127.0.0.1}:${PAPERLEAF_MINIO_PORT:-9000}:9000"
      - "${PAPERLEAF_BIND_ADDRESS:-127.0.0.1}:${PAPERLEAF_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - paperleaf

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${PAPERLEAF_MINIO_BUCKET}" &&
        mc anonymous set none "local/$${PAPERLEAF_MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-paperleaf}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-paperleaf-local}
      PAPERLEAF_MINIO_BUCKET: ${PAPERLEAF_MINIO_BUCKET:-paperleaf-pdfs}
    restart: "no"
    networks:
      - paperleaf

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - paperleaf

  api:
    <<: *backend-service
    command: ["uvicorn", "paperleaf_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${PAPERLEAF_BIND_ADDRESS:-127.0.0.1}:${PAPERLEAF_API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *backend-service
    command: ["python", "-m", "paperleaf_api.worker"]
    expose:
      - "9101"

  prometheus:
    build:
      context: ./ops/prometheus
      args:
        PROMETHEUS_BASE_IMAGE: ${PAPERLEAF_PROMETHEUS_IMAGE:-ghcr.io/prometheus/prometheus:v3.13.2}
    image: paperleaf-prometheus:3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "${PAPERLEAF_BIND_ADDRESS:-127.0.0.1}:${PAPERLEAF_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    networks:
      - paperleaf

  grafana:
    build:
      context: ./ops/grafana
      args:
        DEBIAN_BASE_IMAGE: ${PAPERLEAF_GRAFANA_BASE_IMAGE:-public.ecr.aws/docker/library/debian:bookworm-slim}
    image: paperleaf-grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-paperleaf-local-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${PAPERLEAF_BIND_ADDRESS:-127.0.0.1}:${PAPERLEAF_GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped
    networks:
      - paperleaf

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_DATA_MODE: real
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3001/d/paperleaf-rag/paperleaf-rag}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_DATA_MODE: real
      NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3001/d/paperleaf-rag/paperleaf-rag}
      PAPERLEAF_API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PAPERLEAF_BIND_ADDRESS:-127.0.0.1}:${PAPERLEAF_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - paperleaf

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  paperleaf:
    driver: bridge
