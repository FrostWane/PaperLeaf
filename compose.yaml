  PAPERLEAF_CONTEXT_HARD_LIMIT_RATIO: ${PAPERLEAF_CONTEXT_HARD_LIMIT_RATIO:-0.85}
  PAPERLEAF_CONTEXT_KEEP_RECENT_TURNS: ${PAPERLEAF_CONTEXT_KEEP_RECENT_TURNS:-6}
  PAPERLEAF_CONTEXT_MAX_MEMORIES: ${PAPERLEAF_CONTEXT_MAX_MEMORIES:-5}
  PAPERLEAF_CONTEXT_MAX_SKILLS: ${PAPERLEAF_CONTEXT_MAX_SKILLS:-1}
  PAPERLEAF_WORKER_METRICS_PORT: ${PAPERLEAF_WORKER_METRICS_PORT:-9101}
