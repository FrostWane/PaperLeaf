  PAPERLEAF_CHUNK_OVERLAP_TOKENS: ${PAPERLEAF_CHUNK_OVERLAP_TOKENS:-100}
  PAPERLEAF_CHUNK_SEMANTIC_UNIT_TOKENS: ${PAPERLEAF_CHUNK_SEMANTIC_UNIT_TOKENS:-220}
  PAPERLEAF_RAG_CANDIDATE_POOL_SIZE: ${PAPERLEAF_RAG_CANDIDATE_POOL_SIZE:-40}
  PAPERLEAF_RAG_PER_PAPER_RETRIEVAL_ENABLED: ${PAPERLEAF_RAG_PER_PAPER_RETRIEVAL_ENABLED:-true}
