[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paperleaf-academic-search-mcp"
version = "0.1.0"
description = "PaperLeaf 的只读学术搜索 MCP 服务"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.13,<2",
  "starlette>=0.45,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff==0.11.2"]

[tool.hatch.build.targets.wheel]
packages = ["academic_search_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP017", "B905"]
