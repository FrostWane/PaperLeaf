[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paperleaf-api"
version = "0.2.1"
description = "PaperLeaf 的 FastAPI、页级 RAG 与受控研究 Agent 后端"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.12,<1",
  "argon2-cffi>=23.1,<26",
  "PyMuPDF>=1.24,<2",
  "pgvector>=0.3,<1",
  "minio>=7.2,<8",
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-postgres>=2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff==0.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["paperleaf_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP017", "B905"]
